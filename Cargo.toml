[workspace]
members = [
    "crates/domain",
    "crates/storage",
    "crates/api",
    "crates/app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ruslan Filimonov"]
license = "BSD-3-Clause"
repository = "https://github.com/ruslan-codebase/fraud-guard"
readme = "README.md"

[workspace.dependencies]
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
api = { path = "crates/api" }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
